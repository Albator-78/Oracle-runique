<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Futhark Oracle — Les Runes Parlent</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap');

  :root {
    --ink: #0d0a05;
    --parchment: #f2e8d5;
    --parchment-dark: #e4d4b3;
    --gold: #b8860b;
    --gold-light: #d4a017;
    --gold-pale: #f5deb3;
    --ember: #8b2500;
    --ash: #3a2e22;
    --smoke: #6b5d4f;
    --rune-glow: #c8941a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Cormorant Garamond', serif;
    background: var(--ink);
    color: var(--parchment);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Texture de fond */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, #1a0f00 0%, transparent 70%),
      radial-gradient(ellipse 40% 30% at 20% 80%, #200800 0%, transparent 60%),
      radial-gradient(ellipse 40% 30% at 80% 70%, #0a0500 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* Particules flottantes */
  .particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
  }

  .particle {
    position: absolute;
    width: 2px;
    height: 2px;
    background: var(--gold);
    border-radius: 50%;
    opacity: 0;
    animation: float-up linear infinite;
  }

  @keyframes float-up {
    0% { opacity: 0; transform: translateY(0) scale(0); }
    10% { opacity: 0.6; }
    90% { opacity: 0.2; }
    100% { opacity: 0; transform: translateY(-100vh) scale(0.5); }
  }

  .container {
    position: relative;
    z-index: 2;
    max-width: 820px;
    margin: 0 auto;
    padding: 3rem 2rem 5rem;
  }

  /* En-tête */
  header {
    text-align: center;
    margin-bottom: 3.5rem;
    animation: fade-in 1.2s ease both;
  }

  .header-runes {
    font-size: 2rem;
    color: var(--gold);
    letter-spacing: 1.2rem;
    margin-bottom: 1rem;
    display: block;
    text-shadow: 0 0 20px rgba(200, 148, 26, 0.4);
    animation: pulse-runes 4s ease-in-out infinite;
  }

  @keyframes pulse-runes {
    0%, 100% { text-shadow: 0 0 15px rgba(200, 148, 26, 0.3); }
    50% { text-shadow: 0 0 35px rgba(200, 148, 26, 0.7), 0 0 60px rgba(200, 148, 26, 0.3); }
  }

  h1 {
    font-family: 'Cinzel Decorative', cursive;
    font-size: clamp(1.6rem, 4vw, 2.6rem);
    color: var(--gold-light);
    letter-spacing: 0.15em;
    line-height: 1.3;
    margin-bottom: 0.6rem;
  }

  .subtitle {
    font-size: 1.1rem;
    color: var(--smoke);
    font-style: italic;
    font-weight: 300;
    letter-spacing: 0.08em;
  }

  /* Séparateur ornementé */
  .ornament {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin: 2rem 0;
    color: var(--gold);
    opacity: 0.5;
  }
  .ornament::before, .ornament::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--gold), transparent);
  }
  .ornament span { font-size: 1.4rem; }

  /* Zone de saisie */
  .input-section {
    animation: fade-in 1.2s ease 0.3s both;
  }

  .input-label {
    display: block;
    text-align: center;
    font-size: 1rem;
    color: var(--smoke);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 1.2rem;
    font-weight: 300;
  }

  .input-wrapper {
    position: relative;
    display: flex;
    gap: 0;
    border: 1px solid rgba(184, 134, 11, 0.35);
    background: rgba(20, 12, 3, 0.7);
    backdrop-filter: blur(4px);
    transition: border-color 0.3s;
  }

  .input-wrapper:focus-within {
    border-color: var(--gold);
    box-shadow: 0 0 25px rgba(200, 148, 26, 0.2), inset 0 0 15px rgba(200, 148, 26, 0.05);
  }

  input[type="text"] {
    flex: 1;
    padding: 1.1rem 1.5rem;
    background: transparent;
    border: none;
    outline: none;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.3rem;
    color: var(--parchment);
    letter-spacing: 0.15em;
    caret-color: var(--gold);
  }

  input::placeholder { color: rgba(107, 93, 79, 0.5); }

  button.invoke {
    padding: 1.1rem 2rem;
    background: linear-gradient(135deg, #7a5c00, #b8860b, #7a5c00);
    background-size: 200% 100%;
    border: none;
    cursor: pointer;
    font-family: 'Cinzel Decorative', cursive;
    font-size: 0.75rem;
    color: var(--parchment);
    letter-spacing: 0.15em;
    transition: all 0.4s ease;
    white-space: nowrap;
  }

  button.invoke:hover {
    background-position: 100% 0;
    color: #fff;
  }

  button.invoke:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* Aperçu des runes en temps réel */
  .rune-preview {
    text-align: center;
    margin-top: 1.5rem;
    min-height: 3.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.3rem;
    flex-wrap: wrap;
  }

  .rune-glyph {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 0.15rem;
    opacity: 0;
    transform: translateY(8px);
    animation: rune-appear 0.4s ease forwards;
  }

  @keyframes rune-appear {
    to { opacity: 1; transform: translateY(0); }
  }

  .rune-glyph .r {
    font-size: 2.2rem;
    line-height: 1;
    color: var(--gold-light);
    text-shadow: 0 0 12px rgba(200, 148, 26, 0.5);
    transition: text-shadow 0.3s;
  }

  .rune-glyph:hover .r {
    text-shadow: 0 0 25px rgba(200, 148, 26, 1), 0 0 50px rgba(200, 148, 26, 0.4);
    cursor: default;
  }

  .rune-glyph .l {
    font-size: 0.65rem;
    color: var(--smoke);
    letter-spacing: 0.1em;
    font-style: italic;
  }

  /* Loader */
  .loader {
    display: none;
    text-align: center;
    padding: 3rem;
    animation: fade-in 0.4s ease;
  }

  .loader.active { display: block; }

  .rune-spinner {
    font-size: 3rem;
    display: block;
    animation: spin-rune 2s linear infinite;
    color: var(--gold);
    text-shadow: 0 0 20px var(--gold);
    margin-bottom: 1rem;
  }

  @keyframes spin-rune {
    0% { transform: rotateY(0deg); text-shadow: 0 0 20px var(--gold); }
    50% { transform: rotateY(180deg); text-shadow: 0 0 40px var(--rune-glow); }
    100% { transform: rotateY(360deg); text-shadow: 0 0 20px var(--gold); }
  }

  .loader p {
    color: var(--smoke);
    font-style: italic;
    font-size: 1rem;
    letter-spacing: 0.1em;
  }

  /* Résultat */
  .result-section {
    display: none;
    animation: reveal 0.8s ease both;
  }

  .result-section.active { display: block; }

  @keyframes reveal {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Bandeau de runes */
  .rune-banner {
    text-align: center;
    padding: 2rem;
    background: linear-gradient(135deg, rgba(20,12,3,0.9), rgba(40,25,5,0.9));
    border: 1px solid rgba(184, 134, 11, 0.4);
    border-top: 2px solid var(--gold);
    margin-bottom: 2rem;
    position: relative;
    overflow: hidden;
  }

  .rune-banner::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(200,148,26,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .name-latin {
    font-size: 0.85rem;
    color: var(--smoke);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-bottom: 0.8rem;
  }

  .name-runic {
    font-size: clamp(2.5rem, 8vw, 4.5rem);
    color: var(--gold-light);
    letter-spacing: 0.3em;
    text-shadow: 0 0 30px rgba(200,148,26,0.6), 0 0 60px rgba(200,148,26,0.2);
    line-height: 1;
    display: block;
    margin-bottom: 0.5rem;
  }

  /* Grille des runes individuelles */
  .runes-grid {
    display: flex;
    justify-content: center;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-bottom: 2.5rem;
  }

  .rune-card {
    border: 1px solid rgba(184, 134, 11, 0.25);
    background: rgba(15, 9, 2, 0.8);
    padding: 1rem 0.8rem;
    text-align: center;
    width: 90px;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    cursor: default;
    animation: card-in 0.5s ease both;
  }

  @keyframes card-in {
    from { opacity: 0; transform: scale(0.85); }
    to { opacity: 1; transform: scale(1); }
  }

  .rune-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(200,148,26,0.05), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .rune-card:hover {
    border-color: rgba(184, 134, 11, 0.7);
    box-shadow: 0 0 20px rgba(200,148,26,0.2);
    transform: translateY(-3px);
  }

  .rune-card:hover::before { opacity: 1; }

  .rune-card .symbol {
    font-size: 2.2rem;
    color: var(--gold-light);
    text-shadow: 0 0 10px rgba(200,148,26,0.4);
    display: block;
    margin-bottom: 0.4rem;
    transition: text-shadow 0.3s;
  }

  .rune-card:hover .symbol {
    text-shadow: 0 0 20px rgba(200,148,26,0.9);
  }

  .rune-card .name-rune {
    font-size: 0.75rem;
    color: var(--gold);
    letter-spacing: 0.1em;
    display: block;
    margin-bottom: 0.2rem;
    font-variant: small-caps;
  }

  .rune-card .latin-char {
    font-size: 0.65rem;
    color: var(--smoke);
    font-style: italic;
  }

  /* Section interprétation */
  .interpretation {
    border: 1px solid rgba(184, 134, 11, 0.2);
    background: rgba(12, 7, 1, 0.7);
    padding: 2.5rem;
    position: relative;
  }

  .interpretation::before {
    content: '✦';
    position: absolute;
    top: -0.8rem;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--gold);
    padding: 0 1rem;
    font-size: 1rem;
  }

  .interp-title {
    font-family: 'Cinzel Decorative', cursive;
    font-size: 0.85rem;
    color: var(--gold);
    letter-spacing: 0.2em;
    text-align: center;
    margin-bottom: 2rem;
    text-transform: uppercase;
  }

  .interp-content {
    font-size: 1.1rem;
    line-height: 1.9;
    color: var(--parchment-dark);
    font-weight: 300;
  }

  .interp-content h3 {
    font-family: 'Cinzel Decorative', cursive;
    font-size: 0.8rem;
    color: var(--gold);
    letter-spacing: 0.15em;
    margin: 2rem 0 0.8rem;
    text-transform: uppercase;
  }

  .interp-content h3:first-child { margin-top: 0; }

  .interp-content p { margin-bottom: 1rem; }

  .interp-content em {
    color: var(--gold-pale);
    font-style: italic;
  }

  .interp-content strong {
    color: var(--gold-light);
    font-weight: 600;
  }

  /* Rune signature */
  .rune-signature {
    display: inline-block;
    color: var(--gold);
    font-size: 1.3rem;
    vertical-align: middle;
    margin: 0 0.2rem;
    text-shadow: 0 0 8px rgba(200,148,26,0.5);
  }

  /* Erreur */
  .error-msg {
    text-align: center;
    padding: 2rem;
    color: var(--ember);
    font-style: italic;
    display: none;
    animation: fade-in 0.4s ease;
  }

  .error-msg.active { display: block; }

  @keyframes fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* Pied de page */
  footer {
    text-align: center;
    margin-top: 4rem;
    color: rgba(107, 93, 79, 0.4);
    font-size: 0.8rem;
    letter-spacing: 0.15em;
    font-style: italic;
  }
</style>
</head>
<body>

<div class="particles" id="particles"></div>

<div class="container">

  <header>
    <span class="header-runes">ᚠᚢᚦᚨᚱᚲ</span>
    <h1>L'Oracle Runique</h1>
    <p class="subtitle">Vieux Futhark · Divination & Signification</p>
  </header>

  <div class="ornament"><span>✦</span></div>

  <div class="input-section">
    <label class="input-label" for="nameInput">Inscrivez votre nom ou un mot</label>
    <div class="input-wrapper">
      <input type="text" id="nameInput" placeholder="Arnauld… Sigrid… Lumière…" maxlength="30" autocomplete="off" />
      <button class="invoke" id="invokeBtn" onclick="invokeRunes()">Invoquer</button>
    </div>
    <div class="rune-preview" id="runePreview"></div>
  </div>

  <div class="loader" id="loader">
    <span class="rune-spinner">ᚹ</span>
    <p>Les runes murmurent leur réponse…</p>
  </div>

  <div class="error-msg" id="errorMsg">
    ᚷ Les runes refusent de parler. Vérifiez votre connexion et réessayez.
  </div>

  <div class="result-section" id="result"></div>

  <footer>
    ᚠ · ᚢ · ᚦ · ᚨ · ᚱ · ᚲ — Vieux Futhark Germanique — 24 Runes
  </footer>
</div>

<script>
// ============================================================
// TABLE DES CORRESPONDANCES — Vieux Futhark
// ============================================================
const FUTHARK = {
  a: { rune:'ᚨ', name:'Ansuz',   meaning:'Communication divine, souffle d\'Odin' },
  b: { rune:'ᛒ', name:'Berkanan',meaning:'Fertilité, renaissance, growth' },
  c: { rune:'ᚲ', name:'Kenaz',   meaning:'Torche, lumière intérieure, connaissance' },
  d: { rune:'ᛞ', name:'Dagaz',   meaning:'Aurore, transformation, percée' },
  e: { rune:'ᛖ', name:'Ehwaz',   meaning:'Cheval, voyage, partenariat' },
  f: { rune:'ᚠ', name:'Fehu',    meaning:'Richesse, abondance, prospérité' },
  g: { rune:'ᚷ', name:'Gebo',    meaning:'Don, échange, union' },
  h: { rune:'ᚺ', name:'Hagalaz', meaning:'Grêle, disruption, force naturelle' },
  i: { rune:'ᛁ', name:'Isaz',    meaning:'Glace, immobilité, clarté cristalline' },
  j: { rune:'ᛃ', name:'Jera',    meaning:'Récolte, cycle annuel, justice naturelle' },
  k: { rune:'ᚲ', name:'Kenaz',   meaning:'Torche, lumière intérieure, connaissance' },
  l: { rune:'ᛚ', name:'Laguz',   meaning:'Eau, flux, intuition' },
  m: { rune:'ᛗ', name:'Mannaz',  meaning:'Humanité, conscience, mémoire' },
  n: { rune:'ᚾ', name:'Naudiz',  meaning:'Besoin, contrainte, nécessité' },
  o: { rune:'ᛟ', name:'Othalan', meaning:'Héritage, patrie, ancestres' },
  p: { rune:'ᛈ', name:'Perthro', meaning:'Destin, mystère, le sort qui tombe' },
  q: { rune:'ᚲ', name:'Kenaz',   meaning:'Torche, lumière (assimilé à K)' },
  r: { rune:'ᚱ', name:'Raidho',  meaning:'Voyage, rythme, quête initiatique' },
  s: { rune:'ᛊ', name:'Sowilo',  meaning:'Soleil, victoire, force vitale' },
  t: { rune:'ᛏ', name:'Tiwaz',   meaning:'Tyr, justice, sacrifice guerrier' },
  u: { rune:'ᚢ', name:'Uruz',    meaning:'Auroch, force brute, santé' },
  v: { rune:'ᚢ', name:'Uruz',    meaning:'Force, vitalité (assimilé à U)' },
  w: { rune:'ᚹ', name:'Wunjo',   meaning:'Joie, harmonie, réalisation' },
  x: { rune:'ᚷ', name:'Gebo',    meaning:'Don double (assimilé à GS)' },
  y: { rune:'ᛃ', name:'Jera',    meaning:'Cycle, temps (assimilé à J)' },
  z: { rune:'ᛉ', name:'Algiz',   meaning:'Protection, connexion divine, éveil' },
  // Extensions
  th:{ rune:'ᚦ', name:'Thurisaz',meaning:'Thor, géant, force de la nature' },
  ng:{ rune:'ᛜ', name:'Ingwaz',  meaning:'Inguz, potentiel latent, graine' },
  ae:{ rune:'ᚨ', name:'Ansuz',   meaning:'Son éternel, parole sacrée' },
};

// ============================================================
// PARTICULES AMBIANTES
// ============================================================
function initParticles() {
  const container = document.getElementById('particles');
  for (let i = 0; i < 22; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.bottom = '0';
    p.style.animationDelay = (Math.random() * 12) + 's';
    p.style.animationDuration = (8 + Math.random() * 15) + 's';
    p.style.width = p.style.height = (1 + Math.random() * 3) + 'px';
    container.appendChild(p);
  }
}

// ============================================================
// TRADUCTION NOM → RUNES
// ============================================================
function translateName(name) {
  const chars = [];
  let i = 0;
  const lower = name.toLowerCase().replace(/[^a-z]/g, '');
  while (i < lower.length) {
    const bigram = lower.slice(i, i+2);
    if (bigram === 'th' && FUTHARK['th']) {
      chars.push({ letter: 'th', ...FUTHARK['th'] });
      i += 2;
    } else if (bigram === 'ng' && FUTHARK['ng']) {
      chars.push({ letter: 'ng', ...FUTHARK['ng'] });
      i += 2;
    } else {
      const c = lower[i];
      if (FUTHARK[c]) chars.push({ letter: c.toUpperCase(), ...FUTHARK[c] });
      i++;
    }
  }
  return chars;
}

// ============================================================
// APERÇU EN TEMPS RÉEL
// ============================================================
document.getElementById('nameInput').addEventListener('input', function() {
  const preview = document.getElementById('runePreview');
  const val = this.value.trim();
  if (!val) { preview.innerHTML = ''; return; }
  const runes = translateName(val);
  preview.innerHTML = runes.map((r, idx) =>
    `<span class="rune-glyph" style="animation-delay:${idx * 0.07}s">
      <span class="r">${r.rune}</span>
      <span class="l">${r.letter.toUpperCase()}</span>
    </span>`
  ).join('');
});

document.getElementById('nameInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') invokeRunes();
});

// ============================================================
// APPEL PRINCIPAL
// ============================================================
async function invokeRunes() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) return;

  const btn = document.getElementById('invokeBtn');
  const loader = document.getElementById('loader');
  const result = document.getElementById('result');
  const error = document.getElementById('errorMsg');

  btn.disabled = true;
  loader.classList.add('active');
  result.classList.remove('active');
  result.innerHTML = '';
  error.classList.remove('active');

  const runes = translateName(name);
  const runicStr = runes.map(r => r.rune).join('');
  const runesList = runes.map(r => `${r.letter.toUpperCase()} → ${r.rune} (${r.name})`).join(', ');

  const prompt = `Tu es un runologue et voyant nordique. Le nom "${name}" se transcrit en vieux futhark ainsi : ${runesList}. La transcription runique complète est : ${runicStr}.

Rédige une interprétation divinatoire approfondie en français, structurée en 3 parties avec des titres en markdown (### Titre) :

### Essence Runique
La signification symbolique de chaque rune présente dans ce nom et comment elles s'articulent ensemble (2-3 paragraphes).

### Message des Nornes
Ce que ce nom révèle sur le destin, le caractère et la voie spirituelle de celui qui le porte — selon la tradition nordique des Nornes (fileuses du destin). Mentionne Yggdrasil, les Ases ou Vanes si pertinent (2 paragraphes).

### Oracle Personnel
Une prophétie poétique et personnelle adressée directement à ${name} (3-4 phrases, ton oraculaire et solennel).

Utilise un langage riche, poétique et mystique. Intègre naturellement des termes nordiques (Wyrd, Nornes, Yggdrasil, Ragnark, Mjolnir, Seiðr…). Sois précis et évocateur, pas générique.`;

  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        messages: [{ role: "user", content: prompt }]
      })
    });

    if (!response.ok) throw new Error('API error');
    const data = await response.json();
    const text = data.content.map(b => b.text || '').join('');

    loader.classList.remove('active');
    renderResult(name, runes, runicStr, text);

  } catch(e) {
    loader.classList.remove('active');
    error.classList.add('active');
  }

  btn.disabled = false;
}

// ============================================================
// AFFICHAGE DU RÉSULTAT
// ============================================================
function renderResult(name, runes, runicStr, interpretation) {
  const result = document.getElementById('result');

  // Construire les cartes de runes (dédupliquées pour la grille, mais toutes pour la transcription)
  const seen = new Set();
  const uniqueRunes = runes.filter(r => {
    if (seen.has(r.rune)) return false;
    seen.add(r.rune); return true;
  });

  const cardsHtml = uniqueRunes.map((r, i) =>
    `<div class="rune-card" style="animation-delay:${i*0.08+0.3}s" title="${r.meaning}">
      <span class="symbol">${r.rune}</span>
      <span class="name-rune">${r.name}</span>
      <span class="latin-char">${r.letter.toUpperCase()}</span>
    </div>`
  ).join('');

  // Formater l'interprétation markdown simple → HTML
  const interpHtml = interpretation
    .replace(/### (.+)/g, '<h3>$1</h3>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/\n\n/g, '</p><p>')
    .replace(/\n/g, ' ');

  result.innerHTML = `
    <div class="ornament"><span>✦</span></div>
    <div class="rune-banner">
      <div class="name-latin">${name.toUpperCase()}</div>
      <span class="name-runic">${runicStr}</span>
    </div>
    <div class="runes-grid">${cardsHtml}</div>
    <div class="interpretation">
      <div class="interp-title">✦ Révélation Runique ✦</div>
      <div class="interp-content"><p>${interpHtml}</p></div>
    </div>
  `;

  result.classList.add('active');
  result.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ============================================================
initParticles();
// ============================================================
</script>
</body>
